services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gopgio_app
    restart: unless-stopped
    working_dir: /var/www/html
    env_file:
      - .env.example
    environment:
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-gop_gio_volunteer}
      DB_USERNAME: ${DB_USERNAME:-gopgio_user}
      DB_PASSWORD: ${DB_PASSWORD:-gopgio_secret_2026}
    volumes:
      - ./:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini:ro
    depends_on:
      db:
        condition: service_healthy
    networks:
      - gopgio_network

  webserver:
    image: nginx:1.25-alpine
    container_name: gopgio_nginx
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - gopgio_network

  db:
    image: mysql:8.0
    container_name: gopgio_mysql
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-gop_gio_volunteer}
      MYSQL_USER: ${DB_USERNAME:-gopgio_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-gopgio_secret_2026}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_secret_2026}
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "127.0.0.1:${MYSQL_EXTERNAL_PORT:-33060}:3306"
    volumes:
      - gopgio_mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-root_secret_2026}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - gopgio_network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: gopgio_pma
    restart: unless-stopped
    profiles:
      - dev
      - default
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      UPLOAD_LIMIT: 32M
    ports:
      - "127.0.0.1:${PMA_PORT:-8081}:80"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - gopgio_network

networks:
  gopgio_network:
    driver: bridge

volumes:
  gopgio_mysql_data:
    driver: local
